# ============================================================
# Fly.io config — EINS PVS Bridge (cloud side).
#
# Fastify server (apps/bridge/src/index.ts):
#   GET  /healthz                      → 503 if the scheduler has not ticked in 3
#                                        tick intervals or SELECT 1 fails (2 s)
#   POST /webhooks/healthhub/:linkId   → HealthHub FHIR Subscription delivery
#                                        (only with ENABLE_HEALTHHUB_WEBHOOK=true;
#                                        shelved vendor, route not registered by default)
#   POST /webhooks/red/:linkId         → RED webhook delivery
# Plus the Postgres-polling scheduler tick loop (SCHEDULER_TICK_MS), which
# must keep running even with no inbound HTTP traffic — hence the machine is
# never auto-stopped.
#
# ONE MACHINE. The scheduler takes a per-link lease in pvs_sync_status
# (claimLink: UPDATE next_poll_at ... WHERE due), so a second machine can never
# poll or backfill the same link at the same time (rolling deploys overlap
# safely). Running more than one buys nothing, though: the scheduler is a single
# concurrency-limited loop and each extra machine only adds lease contention.
# fly.toml cannot cap the machine count, so pin it after the first deploy:
#   fly scale count 1 -a eins-bridge
#
# Built from the REPO ROOT so the pnpm workspace + lockfile are in the Docker
# build context (apps/bridge/Dockerfile copies them).
#
#   fly deploy . -c apps/bridge/fly.toml          # from repo root (. = build context)
#
# Required secrets (NOT stored here — set once via fly secrets):
#   fly secrets set -a eins-bridge \
#     BRIDGE_DATABASE_URL="postgres://eins_bridge:...@.../neondb" \
#     APP_KEY="<same 64-hex value as the portal's ENCRYPTION_KEY>" \
#     PORTAL_BASE_URL="https://eins-portal.vercel.app"
# ============================================================

app = "eins-bridge"
primary_region = "fra"   # Frankfurt — EU data residency for Praxis data
# SIGTERM → the scheduler aborts in-flight vendor/portal requests; give it a
# moment to flush before Fly sends SIGKILL.
kill_timeout = 30

[build]
  # Relative to THIS file's dir (apps/bridge). Build context is the repo root,
  # passed as the `.` positional to `fly deploy` (see header), so the Dockerfile's
  # COPY of the pnpm workspace lockfile resolves.
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "7300"
  BRIDGE_PUBLIC_URL = "https://eins-bridge.fly.dev"

[http_service]
  internal_port = 7300
  force_https = true
  # The scheduler must keep ticking, so the machine stays up regardless of HTTP idle.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    # /healthz pings the DB with a 2 s cap, so 3 s leaves room for a slow answer.
    timeout = "3s"
    # The scheduler's first tick is one SCHEDULER_TICK_MS (30 s) after boot;
    # /healthz counts boot time as the last tick, so 10 s is plenty.
    grace_period = "10s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
